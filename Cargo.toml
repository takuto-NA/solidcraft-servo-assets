[package]
name = "solidcraft-servo-assets"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Offline, source-labelled servo reference assets for SolidCraft"
repository = "https://github.com/takuto-NA/solidcraft-servo-assets"
readme = "README.md"

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[features]
legacy-host = []

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "servo-assets"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.57.1"

[profile.release]
opt-level = "s"
lto = true
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
